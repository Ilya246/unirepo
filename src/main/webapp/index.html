<head>
    <title>Login Page</title>
    <meta charset="UTF-8">
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 40px;
            background: #0c0c0c;
            color: #e0e0e0;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
            background: rgba(25, 25, 25, 0.95);
            backdrop-filter: blur(10px);
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            border: 1px solid #333;
        }
        .btn {
            background: #dc3545;
            color: white;
            padding: 10px 20px;
            text-decoration: none;
            border-radius: 5px;
            display: inline-block;
            margin: 10px 0;
            margin-bottom: 100px;
            border: none;
            cursor: pointer;
            transition: background-color 0.2s;
        }
        .btn:hover {
            background: #c82332;
        }
        .register-input {
            margin: 20px 0;
        }
        .register-input label {
            display: block;
            margin-bottom: 5px;
            color: #b0b0b0;
            font-weight: 500;
        }
        .register-input input {
            width: 100%;
            max-width: 300px;
            padding: 10px;
            margin-bottom: 15px;
            background: #1a1a1a;
            border: 1px solid #444;
            border-radius: 5px;
            color: #e0e0e0;
            font-size: 14px;
        }
        .register-input input:focus {
            outline: none;
            border-color: #dc3545;
            box-shadow: 0 0 0 2px rgba(220, 53, 69, 0.2);
        }
        .register-input input::placeholder {
            color: #666;
        }
        .session-info {
            background: #1a2a3a;
            padding: 15px;
            border-radius: 5px;
            margin: 20px 0;
            color: #a0c8e0;
        }
        .status {
            padding: 8px 16px;
            border-radius: 6px;
            font-weight: 600;
            margin-bottom: 15px;
            display: inline-block;
        }
        .status.success {
            background: #1e3a28;
            color: #4ade80;
            border: 1px solid #2d4a38;
        }
        .status.error {
            background: #3a1e1e;
            color: #f87171;
            border: 1px solid #4a2d2d;
        }
        h1 {
            color: #ffffff;
            margin-bottom: 30px;
        }
    </style>
    <script src="api.js"></script>
    <script>
        let api = new APIClient();
        // Предотвращаем кэширование страницы
        window.onpageshow = function(event) {
            if (event.persisted) {
                window.location.reload();
            }
        };

        function showStatus(message, type) {
            // Удаляем существующие статусы
            let existingStatus = document.querySelector('.status-notification');
            if (existingStatus) {
                existingStatus.remove();
            }

            let status = document.createElement('div');
            status.className = `status ${type} status-notification`;
            status.textContent = message;
            status.style.position = 'fixed';
            status.style.top = '20px';
            status.style.right = '20px';
            status.style.zIndex = '1001';
            status.style.padding = '15px 20px';
            status.style.borderRadius = '6px';
            status.style.boxShadow = '0 4px 12px rgba(0,0,0,0.3)';
            status.style.maxWidth = '400px';
            status.style.wordWrap = 'break-word';

            document.body.appendChild(status);

            setTimeout(() => {
                if (status.parentNode) {
                    status.remove();
                }
            }, 5000);
        }

        // Принудительный logout
        function forceLogout() {
            // Очищаем все хранилища
            localStorage.clear();
            sessionStorage.clear();

            // Делаем запрос для сброса аутентификации
            fetch('/force-new-auth', {
                method: 'GET',
                headers: {
                    'Authorization': 'Basic ' + btoa('logout:logout')
                },
                credentials: 'include'
            }).then(() => {
                // Перезагружаем с принудительной аутентификацией
                window.location.href = '/login?date=' + Date.now();
            });
        }

        async function tryRegister() {
            try {
                await api.register(document.getElementById('NameInput').value, document.getElementById('PassInput').value);
                showStatus('Регистрация успешна!', 'success');
            } catch (error) {
                showStatus('Ошибка регистрации: ' + error.message, 'error');
            }
        }
    </script>
</head>
<body>
<div class="container">
    <h1>Login Page</h1>

    <button onclick="forceLogout()" class="btn">Login</button>

    <div class="register-input">
        <label for="NameInput">Username</label>
        <input type="text" id="NameInput" placeholder="User">
        <label for="PassInput">Password</label>
        <input type="text" id="PassInput" placeholder="Pass">
    </div>
    <button onclick="tryRegister()" class="btn">Register</button>
</div>
</body>
