<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Authentication Required</title>
    <style>
        body {
            font-family: Arial;
            margin: 0;
            padding: 0;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .auth-container {
            background: white;
            padding: 40px;
            border-radius: 15px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.1);
            text-align: center;
            max-width: 500px;
        }
    </style>
</head>
<body>
<div class="auth-container">
    <div style="font-size: 48px; margin-bottom: 20px;">🔐</div>
    <h1>Authentication Required</h1>
    <p>Please check your browser for a login dialog.</p>
    <button onclick="retryAuth()" style="background: #667eea; color: white; padding: 12px 30px; border: none; border-radius: 25px; cursor: pointer;">
        Retry Authentication
    </button>
</div>

<script>
    function retryAuth() {
        window.location.href = '/';
    }

    // Автоматически пытаемся вызвать аутентификацию
    setTimeout(() => {
        fetch('/', {
            headers: {'Authorization': 'Basic invalid'}
        }).catch(() => {});
    }, 1000);
</script>
</body>
</html>
