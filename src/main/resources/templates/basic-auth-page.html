<!DOCTYPE html>
<html>
<head>
    <title>Authentication Required</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .auth-container {
            background: white;
            padding: 40px;
            border-radius: 15px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.1);
            text-align: center;
            max-width: 500px;
        }
        .auth-icon {
            font-size: 48px;
            margin-bottom: 20px;
        }
        .retry-btn {
            background: #667eea;
            color: white;
            padding: 12px 30px;
            border: none;
            border-radius: 25px;
            cursor: pointer;
            font-size: 16px;
            margin: 10px;
        }
        .info-box {
            background: #f8f9fa;
            padding: 15px;
            border-radius: 8px;
            margin: 20px 0;
            text-align: left;
        }
    </style>
    <script>
        function forceAuth() {
            // Создаем запрос с неправильными credentials чтобы сбросить кэш
            fetch('/clear-auth-cache', {
                credentials: 'include'
            }).then(() => {
                // Перезагружаем страницу
                location.reload(true);
            });
        }

        // Автоматически пытаемся сбросить кэш при загрузке
        setTimeout(forceAuth, 1000);
    </script>
</head>
<body>
<div class="auth-container">
    <div class="auth-icon">🔐</div>
    <h1>Authentication Required</h1>
    <div class="info-box">
        <p><strong>Please check your browser for a login dialog.</strong></p>
        <p>If no dialog appears or you see cached credentials:</p>
        <ol>
            <li>Cancel the login dialog</li>
            <li>Click "Retry Authentication" below</li>
            <li>Enter your credentials again</li>
        </ol>
    </div>
    <button onclick="forceAuth()" class="retry-btn">Retry Authentication</button>
    <p><small>Browser: {{browserInfo}}</small></p>
</div>
</body>
</html>
